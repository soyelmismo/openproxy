# docker-compose.yml — openproxy single-container deployment.
#
# Pulls the multi-arch image from ghcr.io (built by .github/workflows/ci.yml).
# To build locally instead, comment out `image:` and uncomment `build:`.
#
# Usage:
#   1. `docker compose up -d` (works out of the box: the image ships a
#      container config binding 0.0.0.0:8787, and the host-side port mapping
#      below is loopback-only).
#   2. Visit http://localhost:8787/v1/health to confirm the server is up.
#   3. To expose the service beyond the host, change the ports mapping to
#      "8787:8787" AND put a TLS-terminating reverse proxy in front — the
#      binary has no TLS support and admin credentials would otherwise
#      travel in cleartext (OP-04).
#
# The dashboard SPA is embedded into the openproxy binary at compile time via
# rust-embed (see `crates/openproxy-server/src/admin_ui.rs`), so this single
# container serves BOTH the API (/v1/*, /admin/api/*) and the dashboard
# (/admin/*) on the same port. No second container, no second port.

services:
  openproxy:
    image: ${OPENPROXY_IMAGE:-ghcr.io/dimasskuy/openproxy:latest}
    # build: .
    container_name: openproxy
    ports:
      # Security (OP-04): loopback-only on the host by default. The dashboard,
      # admin API, WebSocket and public API all share this single plain-HTTP
      # port; mapping it to 0.0.0.0 without a TLS reverse proxy in front
      # exposes admin credentials on the network.
      - "127.0.0.1:8787:8787"
    volumes:
      # Optional: mount your own config over the image default
      # (/etc/openproxy/config.toml, which binds 0.0.0.0:8787 inside the
      # container). Commented out so `docker compose up -d` works with no
      # local files.
      # - ./config.toml:/etc/openproxy/config.toml:ro
      - openproxy-data:/var/lib/openproxy
      # Optional: mount model weights for in-process Laya decision routing
      # - ./models/laya:/var/lib/openproxy/models/laya:ro
    environment:
      # Override the config path if you mount it somewhere else.
      - OPENPROXY_CONFIG=/etc/openproxy/config.toml
      # `RUST_LOG` overrides [logging].level if set.
      - RUST_LOG=info
    restart: unless-stopped
    # Security/ops (OP-23): the image declares a real HEALTHCHECK
    # (`openproxy --healthcheck`, TCP connect — distroless has no wget), so
    # Compose inherits it from the image; no broken wget-based test here
    # anymore (it kept the container permanently `unhealthy`).

volumes:
  openproxy-data:
