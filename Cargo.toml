[workspace]
resolver = "2"
members = [
    "crates/openproxy-core",
    "crates/openproxy-server",
    "crates/openproxy-api-client",
    "crates/openproxy-types",
    "crates/openproxy-db",
    "crates/openproxy-compression",
    "crates/openproxy-adapters",
    "crates/openproxy-pipeline",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0"
authors = ["openproxy contributors"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
parking_lot = { version = "0.12", features = ["send_guard", "arc_lock"] }
rand = "0.10"
hex = "0.4"
aes-gcm = "0.11"
argon2 = "0.5"
base64 = "0.23"
tdigest = "1.0.0"
dashmap = "6"
toml = "1.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = false }
regex = "1"
sha2 = "0.11"
zeroize = "1"
urlencoding = "2.1"
miniz_oxide = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd", "compression-br"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
clone_on_ref_ptr = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
uninlined_format_args = "deny"
explicit_iter_loop = "deny"
unwrap_used = "deny"
manual_split_once = "deny"
needless_collect = "deny"
manual_let_else = "deny"
manual_is_variant_and = "deny"
manual_string_new = "deny"
manual_strip = "deny"
map_unwrap_or = "deny"

# Noise suppression for practical maintainability
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"
items_after_statements = "allow"
default_trait_access = "allow"
used_underscore_binding = "allow"
wildcard_enum_match_arm = "allow"
doc_link_with_quotes = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
redundant_closure_for_method_calls = "allow"
duration_suboptimal_units = "allow"
struct_field_names = "allow"
implicit_hasher = "allow"
unreadable_literal = "allow"
missing_fields_in_debug = "allow"
no_effect_underscore_binding = "allow"
float_cmp = "allow"
match_wildcard_for_single_variants = "allow"
if_not_else = "allow"
cast_lossless = "allow"
needless_continue = "allow"
format_collect = "allow"
implicit_clone = "allow"
semicolon_if_nothing_returned = "allow"
unused_async = "allow"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

# Reduce debug info en dev para evitar inflado de target/ (backtraces siguen funcionando)
[profile.dev]
debug = "line-tables-only"
