[package]
name = "openproxy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Default-on: build the new `upstream/` hyper-based client alongside the
# `default-features = false`) for openproxy-core disables the module.
# feature flag is only a compile-time switch for the new module.
default = ["upstream-hyper", "laya-engine"]
laya-engine = ["openproxy-adapters/laya-engine"]
upstream-hyper = ["dep:hyper", "dep:hyper-util", "dep:http", "dep:http-body", "dep:http-body-util", "dep:futures-util", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "dep:socket2"]
# Stub gate for callers that want to disable just this client (e.g.
# downstream consumers building with `default-features = false`).
upstream-stub = []
# Allow private/reserved IP addresses in upstream connections (SSRF bypass).
# Used by downstream test harnesses (e.g. openproxy-api-client) that connect
# to localhost mock servers.
ssrf-bypass = []

[dependencies]
openproxy-types = { path = "../openproxy-types" }
openproxy-db = { path = "../openproxy-db" }
openproxy-compression = { path = "../openproxy-compression" }
openproxy-adapters = { path = "../openproxy-adapters", features = ["test-utils"] }
openproxy-pipeline = { path = "../openproxy-pipeline" }
openproxy-notifications = { path = "../openproxy-notifications" }
openproxy-analytics = { path = "../openproxy-analytics" }
openproxy-pricing = { path = "../openproxy-pricing" }
openproxy-oauth = { path = "../openproxy-oauth" }
openproxy-discovery = { path = "../openproxy-discovery" }
openproxy-proxy-pool = { path = "../openproxy-proxy-pool" }
tokio = { workspace = true }
axum.workspace = true
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
chrono.workspace = true
uuid = { workspace = true }
# `tokio_util::sync::CancellationToken` lives behind the `rt` feature.
# direct dep so the discovery scheduler can fan out `cancel()` to every
# per-provider task with broadcast semantics. See Gate E1 spec.
tokio-util = { workspace = true, features = ["rt"] }
parking_lot = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }
miniz_oxide = { workspace = true }

# --- hyper-based upstream client (Gate 0) ---

# Pinned to versions that are already present in the workspace lockfile
# so disabling the module also disables the direct dep; that keeps
# `cargo build -p openproxy-core --no-default-features` working.
hyper = { workspace = true, features = ["client", "http1", "http2"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio", "http1", "http2"], optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, features = ["channel"], optional = true }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"], optional = true }
socket2 = { workspace = true, features = ["all"], optional = true }
tokio-rustls = { workspace = true, features = ["logging", "ring", "tls12"], optional = true }
rustls = { workspace = true, features = ["logging", "std", "tls12", "ring"], optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
governor = { workspace = true }

[dev-dependencies]
# Re-enable `tokio`'s `test-util` feature ONLY for the test
# build. The `start_paused` and `advance` helpers on
# `tokio::time` live behind this feature; we use them in the
# discovery scheduler's unit tests to step a paused clock
# through several tick boundaries in microseconds, instead of
# burning wall-clock seconds in `sleep`. Not a runtime
# dep — `cargo build --release` of the production binary
# does NOT pull this in.
tokio = { workspace = true, features = ["test-util"] }
# HTTP mock server for the free-proxy scraper integration tests.
# Hoisted to `[workspace.dependencies]` (also a dev-dep of
# openproxy-api-client); not a runtime dep.
httpmock = { workspace = true }
# Enable `ssrf-bypass` on openproxy-adapters ONLY for the test
# build so `httpmock::MockServer` (127.0.0.1) is reachable from
# the new free-proxy scraper end-to-end tests (T1-T3). This is
# a dev-deps feature override (mirrors api-client/Cargo.toml:24)
# and never affects production binaries.
openproxy-adapters = { path = "../openproxy-adapters", features = ["ssrf-bypass"] }
# Benchmark harness for the SSE chunk-forwarding hot path.
# Used by `cargo bench -p openproxy-core --bench sse_fast_path`.
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "sse_fast_path"
harness = false


[[bench]]
name = "oauth_refresh"
harness = false

[[bench]]
name = "sync_bench"
harness = false

[[bench]]
name = "free_proxies"
harness = false
