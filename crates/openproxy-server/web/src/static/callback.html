<!DOCTYPE html>
<html>
<head>
  <title>OAuth Callback</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: #e0e0e0; }
    .status { margin-top: 2rem; }
  </style>
</head>
<body>
  <h2>OAuth Authorization</h2>
  <div class="status" id="status">Processing authorization...</div>
  <script>
    (async function() {
      const status = document.getElementById('status');
      try {
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        // Only the standard OAuth `code` parameter is honoured. Aliases such
        // as `apiKey`/`token`/`key` are not part of any flow that redirects
        // here and would only widen the reflection surface of this page.
        const code = params.get('code') || hashParams.get('code');
        const error = params.get('error') || hashParams.get('error');

        if (error) {
          status.textContent = 'Authorization failed: ' + error;
          return;
        }

        if (!code) {
          status.textContent = 'No authorization code received';
          return;
        }

        // Send the code to the parent window. The dashboard may be open on
        // `localhost` while this callback lands on `127.0.0.1` (Devin's
        // allowlist only accepts the literal IP), so post to every loopback
        // alias of this origin — non-matching targets are dropped by the
        // browser, the matching one delivers to our own opener only.
        if (window.opener) {
          const origins = [
            window.location.origin,
            window.location.origin.replace('127.0.0.1', 'localhost'),
            window.location.origin.replace('localhost', '127.0.0.1'),
          ];
          for (const target of new Set(origins)) {
            window.opener.postMessage({ type: 'oauth_code', code: code }, target);
          }
          status.textContent = 'Authorization successful! You can close this window.';
          setTimeout(() => window.close(), 2000);
        } else {
          status.textContent = 'Authorization code: ' + code;
        }
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    })();
  </script>
</body>
</html>
