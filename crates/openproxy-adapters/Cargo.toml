[package]
name = "openproxy-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["upstream-hyper", "laya-engine"]
upstream-hyper = ["dep:hyper", "dep:hyper-util", "dep:http-body", "dep:http-body-util", "dep:futures-util", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "dep:socket2", "dep:io-uring", "dep:libc"]
test-utils = []
ssrf-bypass = []
# Bench-only: lets the perf harness trust a local CA for TLS+h2 upstreams.
# Never enabled by default; production builds do not include the hook.
bench-tls-hook = []
laya-engine = ["dep:tokenizers"]

[dependencies]
base64.workspace = true
openproxy-types = { path = "../openproxy-types" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
dashmap.workspace = true
tower-service = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
miniz_oxide = { workspace = true }
# CRC32 for gzip trailer verification. `miniz_oxide::inflate::stream`
# implements neither gzip nor CRC/ISIZE, so the container is parsed here and
# the checksum computed independently.
crc32fast = { workspace = true }
brotli-decompressor = { workspace = true }
zstd = { workspace = true }

hyper = { workspace = true, features = ["client", "http1", "http2"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio", "http1", "http2"], optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, features = ["channel"], optional = true }
futures-util = { workspace = true, features = ["std"], optional = true }
socket2 = { workspace = true, features = ["all"], optional = true }
tokio-rustls = { workspace = true, features = ["logging", "ring", "tls12"], optional = true }
rustls = { workspace = true, features = ["logging", "std", "tls12", "ring"], optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http2"] }

[build-dependencies]
cc = { workspace = true }
