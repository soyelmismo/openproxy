tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
futures-util = "0.3"
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
