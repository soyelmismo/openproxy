[package]
name = "openproxy-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["laya-engine"]
laya-engine = ["openproxy-adapters/laya-engine"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "sse_streaming"
harness = false

[[bench]]
name = "think_extractor"
harness = false


[[bench]]
name = "sse_accumulator"
harness = false

[[bench]]
name = "token_throughput"
harness = false

[dependencies]
openproxy-types = { path = "../openproxy-types" }
openproxy-db = { path = "../openproxy-db" }
openproxy-adapters = { path = "../openproxy-adapters", features = ["test-utils"] }
openproxy-compression = { path = "../openproxy-compression" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
