# cargo-deny configuration for openproxy
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[advisories]
yanked = "warn"
ignore = [
    # paste is unmaintained, pulled transitively by tokenizers (huggingface)
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "GPL-3.0",
    "GPL-3.0-only",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Transitive duplicates allowlist with documented justifications
skip = [
    # httpmock 0.8.3 uses headers 0.3 which pulls base64 0.22,
    # while the rest of the workspace uses base64 0.23.
    # Will be removed once httpmock updates to headers 0.4 / base64 0.23.
    { crate = "base64@0.13.1", reason = "tokenizers -> spm_precompiled -> base64 0.13 transitively while workspace uses 0.23" },
    { crate = "base64@0.22.1", reason = "httpmock -> headers -> base64 0.22 transitively while workspace uses 0.23" },
    { crate = "block-buffer@0.10.4", reason = "transitive dependency from rustcrypto ecosystem" },
    { crate = "cpufeatures@0.2.17", reason = "transitive dependency from rustcrypto ecosystem" },
    { crate = "crypto-common@0.1.7", reason = "transitive dependency from rustcrypto ecosystem" },
    { crate = "digest@0.10.7", reason = "transitive dependency from rustcrypto ecosystem" },
    { crate = "getrandom@0.2.17", reason = "transitive dependency transition between 0.2 and 0.3" },
    { crate = "getrandom@0.3.4", reason = "transitive dependency transition between 0.2 and 0.3" },
    { crate = "hashbrown@0.14.5", reason = "transitive dependency from dashmap/indexmap" },
    { crate = "hashbrown@0.16.1", reason = "transitive dependency from dashmap/indexmap" },
    { crate = "r-efi@5.3.0", reason = "transitive dependency from rustls" },
    { crate = "rand@0.9.5", reason = "transitive dependency from governor/axum" },
    { crate = "rand_core@0.9.5", reason = "transitive dependency from rand 0.9" },
    { crate = "syn@2.0.119", reason = "proc-macro dependency transition to syn 3" },
    { crate = "windows-sys@0.52.0", reason = "transitive dependency for Windows platform targets" },
]
