# openproxy configuration example.
# Copy to `config.toml` and edit as needed. See docs/mvp-spec.md section 10.

[server]
bind = "127.0.0.1:8787"
# Optional isolated admin listener. Omit to keep API + dashboard on bind.
# admin_bind = "127.0.0.1:8788"
request_max_body_bytes = 33554432  # enforced request body limit (default 32 MiB)
# Trusted proxy IPs/CIDRs authorised to set X-Forwarded-For / X-Real-IP /
# RFC 7239 Forwarded. Loopback is NOT trusted by default (security: if you
# run openproxy behind nginx on 127.0.0.1 you MUST list 127.0.0.1 / ::1 here
# or per-IP rate limits and the admin-auth throttle will key on the TCP peer
# IP — i.e. all clients will share the proxy's IP bucket).
# trusted_proxies = ["127.0.0.1", "::1"]

[storage]
database_path = "~/.openproxy/data.db"
# Reader connections: 0 auto-sizes to available CPUs; explicit values 1..32.
reader_count = 0
encryption_key_source = "env"  # env | file
# With source = "file", the master key is read from this path instead
# (base64 of 32 bytes, mode 0600 — the server refuses looser permissions):
# encryption_key_file = "/etc/openproxy/master.key"

[racing]
default_race_size = 1
max_race_size = 8
abort_grace_ms = 500

[timeouts]
connect_ms = 5000
request_send_ms = 10000
ttft_ms = 6000
idle_chunk_ms = 120000
total_ms = 300000

[retries]
max_attempts = 3
backoff_base_ms = 200
backoff_factor = 2
backoff_jitter_pct = 50
# combo_max_attempts = 1  # Retry the entire combo walk when all targets fail (1 = off)

[circuit_breaker]
failure_threshold = 5
unhealthy_duration_ms = 60000

[logging]
format = "json"  # json | text
level = "info"

[compression]
# Modo de compresión: "off" | "lite" | "rtk"
#   off   → sin compresión
#   lite  → colapsa whitespace, dedup system prompts, trunca tool results,
#            remueve contenido redundante, reemplaza imágenes (zero semantic change, ~15% ahorro)
#   rtk   → filtra output de comandos CLI (git, cargo, npm, docker, etc.),
#            deduplica líneas repetidas, trunca inteligentemente (~60-90% en tool results)
mode = "off"

[quota_protection]
# Enable dynamic quota protection and load balancing/rotation.
# Default: true.
enabled = true

# Reserved quota threshold percentage (1-99). Accounts dropping below this
# will have those models marked as protected and avoided if other accounts
# have quota. Default: 10.
threshold_percentage = 10
